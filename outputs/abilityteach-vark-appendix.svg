<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">VARK learning preferences appendix</title><desc id="desc">The four VARK modalities with student-friendly descriptions and a note against fixed learner labels.</desc>
  <rect width="1920" height="1080" fill="#F7F6F1"/><path d="M0 0h1920v16H0z" fill="#365A48"/>
  <text x="116" y="100" fill="#365A48" font-family="Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="-1">Ability<tspan fill="#252C27" font-weight="400">Teach</tspan></text>
  <text x="1804" y="99" fill="#71806C" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="3">APPENDIX</text>
  <line x1="116" y1="136" x2="1804" y2="136" stroke="#E2E4DB" stroke-width="2"/>
  <text x="116" y="255" fill="#252C27" font-family="Arial,sans-serif" font-size="72" font-weight="600" letter-spacing="-3">VARK describes preferences.</text>
  <text x="116" y="320" fill="#365A48" font-family="Arial,sans-serif" font-size="35" font-weight="500">It doesn't define a child.</text>
  <text x="120" y="390" fill="#6E766E" font-family="Arial,sans-serif" font-size="22">Four ways to explore a lesson. Most children use more than one.</text>
  <rect x="116" y="455" width="1688" height="62" rx="4" fill="#E8EDE2"/>
  <text x="150" y="494" fill="#536D52" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">LETTER</text>
  <text x="350" y="494" fill="#536D52" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">VARK PREFERENCE</text>
  <text x="770" y="494" fill="#536D52" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">SAY IT TO A CHILD</text>
  <line x1="116" y1="612" x2="1804" y2="612" stroke="#E2E4DB" stroke-width="2"/>
  <text x="150" y="585" fill="#365A48" font-family="Arial,sans-serif" font-size="42" font-weight="700">V</text>
  <text x="350" y="580" fill="#252C27" font-family="Arial,sans-serif" font-size="25" font-weight="600">Visual</text>
  <text x="770" y="580" fill="#4E574E" font-family="Arial,sans-serif" font-size="24">“Show me a picture, chart, or map.”</text>
  <line x1="116" y1="711" x2="1804" y2="711" stroke="#E2E4DB" stroke-width="2"/>
  <text x="150" y="684" fill="#365A48" font-family="Arial,sans-serif" font-size="42" font-weight="700">A</text>
  <text x="350" y="679" fill="#252C27" font-family="Arial,sans-serif" font-size="25" font-weight="600">Aural</text>
  <text x="770" y="679" fill="#4E574E" font-family="Arial,sans-serif" font-size="24">“Let's listen or talk it through.”</text>
  <line x1="116" y1="810" x2="1804" y2="810" stroke="#E2E4DB" stroke-width="2"/>
  <text x="150" y="783" fill="#365A48" font-family="Arial,sans-serif" font-size="42" font-weight="700">R</text>
  <text x="350" y="778" fill="#252C27" font-family="Arial,sans-serif" font-size="25" font-weight="600">Read / Write</text>
  <text x="770" y="778" fill="#4E574E" font-family="Arial,sans-serif" font-size="24">“Let me read it, write it, or make a list.”</text>
  <line x1="116" y1="909" x2="1804" y2="909" stroke="#E2E4DB" stroke-width="2"/>
  <text x="150" y="882" fill="#365A48" font-family="Arial,sans-serif" font-size="42" font-weight="700">K</text>
  <text x="350" y="877" fill="#252C27" font-family="Arial,sans-serif" font-size="25" font-weight="600">Kinesthetic</text>
  <text x="770" y="877" fill="#4E574E" font-family="Arial,sans-serif" font-size="24">“Let me try it or see a real example.”</text>
  <text x="120" y="1007" fill="#788078" font-family="Arial,sans-serif" font-size="16">Use VARK to offer choices, not sort students. Evidence for matching teaching to fixed styles is mixed.</text>
  <text x="120" y="1046" fill="#71806C" font-family="Arial,sans-serif" font-size="14">Definitions: vark-learn.com/about-vark/frequently-asked-questions · Evidence: Clinton-Lisell &amp; Litzinger, 2024, Frontiers in Psychology</text>
</svg>
