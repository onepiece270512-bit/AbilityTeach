<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AbilityTeach solution</title><desc id="desc">A curriculum platform with more than one way for each child to explore a lesson.</desc>
  <rect width="1920" height="1080" fill="#F7F6F1"/>
  <path d="M0 0h1920v16H0z" fill="#365A48"/>
  <text x="116" y="100" fill="#365A48" font-family="Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="-1">Ability<tspan fill="#252C27" font-weight="400">Teach</tspan></text>
  <text x="1804" y="99" fill="#71806C" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="3">THE SOLUTION</text>
  <line x1="116" y1="136" x2="1804" y2="136" stroke="#E2E4DB" stroke-width="2"/>
  <text x="116" y="304" fill="#252C27" font-family="Arial,sans-serif" font-size="91" font-weight="600" letter-spacing="-5">One curriculum.</text>
  <text x="116" y="412" fill="#365A48" font-family="Arial,sans-serif" font-size="91" font-weight="600" letter-spacing="-5">More ways in.</text>
  <text x="120" y="478" fill="#6E766E" font-family="Arial,sans-serif" font-size="26">Lessons that help every child take part.</text>
  <line x1="120" y1="563" x2="790" y2="563" stroke="#E4E5DC" stroke-width="2"/>
  <text x="120" y="614" fill="#788273" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">A CHILD CAN…</text>
  <text x="120" y="685" fill="#252C27" font-family="Arial,sans-serif" font-size="29" font-weight="600">Find a lesson.</text>
  <text x="120" y="739" fill="#252C27" font-family="Arial,sans-serif" font-size="29" font-weight="600">Choose how to explore.</text>
  <text x="120" y="793" fill="#252C27" font-family="Arial,sans-serif" font-size="29" font-weight="600">Try it with their class.</text>
  <text x="120" y="847" fill="#252C27" font-family="Arial,sans-serif" font-size="29" font-weight="600">Show what they learned.</text>
  <circle cx="744" cy="678" r="7" fill="#E9A27C"/><circle cx="744" cy="732" r="7" fill="#A7C9CF"/><circle cx="744" cy="786" r="7" fill="#91A978"/><circle cx="744" cy="840" r="7" fill="#D3B985"/>
  <line x1="908" y1="205" x2="908" y2="865" stroke="#DDE1D6" stroke-width="2"/>
  <text x="1000" y="254" fill="#788273" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">EXPLORE THIS LESSON</text>
  <text x="1000" y="326" fill="#252C27" font-family="Arial,sans-serif" font-size="43" font-weight="600" letter-spacing="-1.3">How do plants grow?</text>
  <text x="1000" y="379" fill="#6E766E" font-family="Arial,sans-serif" font-size="22">Pick a way to find out.</text>
  <text x="1000" y="500" fill="#365A48" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">01</text>
  <text x="1070" y="503" fill="#252C27" font-family="Arial,sans-serif" font-size="31" font-weight="600">Read a story</text>
  <text x="1070" y="542" fill="#788078" font-family="Arial,sans-serif" font-size="20">“Let's meet a seed.”</text>
  <line x1="1000" y1="577" x2="1760" y2="577" stroke="#E5E6DE" stroke-width="2"/>
  <text x="1000" y="645" fill="#365A48" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">02</text>
  <text x="1070" y="648" fill="#252C27" font-family="Arial,sans-serif" font-size="31" font-weight="600">Listen &amp; talk</text>
  <text x="1070" y="687" fill="#788078" font-family="Arial,sans-serif" font-size="20">“Let's wonder together.”</text>
  <line x1="1000" y1="722" x2="1760" y2="722" stroke="#E5E6DE" stroke-width="2"/>
  <text x="1000" y="790" fill="#365A48" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">03</text>
  <text x="1070" y="793" fill="#252C27" font-family="Arial,sans-serif" font-size="31" font-weight="600">Try it hands-on</text>
  <text x="1070" y="832" fill="#788078" font-family="Arial,sans-serif" font-size="20">“Let's plant one.”</text>
  <rect x="0" y="930" width="1920" height="150" fill="#E8EDE2"/>
  <text x="120" y="988" fill="#536D52" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">TRUST CHECKS</text>
  <text x="120" y="1037" fill="#334936" font-family="Arial,sans-serif" font-size="22" font-weight="600">Clear goals</text>
  <text x="337" y="1037" fill="#334936" font-family="Arial,sans-serif" font-size="22" font-weight="600">Visible evidence</text>
  <text x="620" y="1037" fill="#334936" font-family="Arial,sans-serif" font-size="22" font-weight="600">Teacher judgment</text>
  <text x="925" y="1037" fill="#334936" font-family="Arial,sans-serif" font-size="22" font-weight="600">Student privacy</text>
  <text x="1760" y="1036" fill="#788273" font-family="Arial,sans-serif" font-size="17" text-anchor="end">No child is one way to learn.</text>
</svg>
